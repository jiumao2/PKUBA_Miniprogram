name: Release and deploy production

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: pkuba-production-release
  cancel-in-progress: false

jobs:
  verified-main:
    name: Verify tag and completed main CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse "$VERSION_TAG^{commit}")" == "$GITHUB_SHA" ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Require successful CI for the exact main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          run_id=""
          for attempt in 1 2 3 4 5 6; do
            runs_json=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f status=completed \
              -f head_sha="$GITHUB_SHA" \
              -f per_page=100)
            run_id=$(jq -r --arg sha "$GITHUB_SHA" \
              '.workflow_runs
                | map(select(
                    .head_sha == $sha
                    and .head_branch == "main"
                    and .event == "push"
                    and .status == "completed"
                    and .conclusion == "success"
                  ))
                | first
                | .id // empty' <<<"$runs_json")
            [[ -n "$run_id" ]] && break
            [[ $attempt -eq 6 ]] || sleep 10
          done
          [[ -n "$run_id" ]] || {
            echo "No successful completed main push CI run exists for $GITHUB_SHA" >&2
            exit 1
          }

          jobs_json=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
          for required_job in backend frontend openapi; do
            total=$(jq --arg name "$required_job" \
              '[.jobs[] | select(.name == $name)] | length' <<<"$jobs_json")
            successful=$(jq --arg name "$required_job" \
              '[.jobs[] | select(
                .name == $name
                and .status == "completed"
                and .conclusion == "success"
              )] | length' <<<"$jobs_json")
            [[ $total -eq 1 && $successful -eq 1 ]] || {
              echo "Required CI job $required_job was not uniquely successful" >&2
              exit 1
            }
          done
          echo "Accepted CI run $run_id for exact main commit $GITHUB_SHA"

  publish:
    name: Publish immutable images
    needs: verified-main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
      postgres_digest: ${{ steps.base-images.outputs.postgres_digest }}
      caddy_digest: ${{ steps.base-images.outputs.caddy_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror approved PostgreSQL and Caddy indexes
        id: base-images
        env:
          POSTGRES_SOURCE_DIGEST: sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          CADDY_SOURCE_DIGEST: sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
        run: |
          set -Eeuo pipefail
          postgres_ref="ghcr.io/jiumao2/pkuba-postgres:${{ github.ref_name }}"
          caddy_ref="ghcr.io/jiumao2/pkuba-caddy:${{ github.ref_name }}"
          docker buildx imagetools create \
            --tag "$postgres_ref" \
            --tag "ghcr.io/jiumao2/pkuba-postgres:sha-${{ github.sha }}" \
            "docker.io/library/postgres@$POSTGRES_SOURCE_DIGEST"
          docker buildx imagetools create \
            --tag "$caddy_ref" \
            --tag "ghcr.io/jiumao2/pkuba-caddy:sha-${{ github.sha }}" \
            "docker.io/library/caddy@$CADDY_SOURCE_DIGEST"
          postgres_digest=$(docker buildx imagetools inspect "$postgres_ref" \
            --format '{{json .Manifest}}' | jq -r .digest)
          caddy_digest=$(docker buildx imagetools inspect "$caddy_ref" \
            --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$postgres_digest" == "$POSTGRES_SOURCE_DIGEST" ]]
          [[ "$caddy_digest" == "$CADDY_SOURCE_DIGEST" ]]
          echo "postgres_digest=$postgres_digest" >> "$GITHUB_OUTPUT"
          echo "caddy_digest=$caddy_digest" >> "$GITHUB_OUTPUT"

      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          provenance: mode=max
          cache-from: type=gha,scope=pkuba-api
          cache-to: type=gha,mode=max,scope=pkuba-api
          tags: |
            ghcr.io/jiumao2/pkuba-api:${{ github.ref_name }}
            ghcr.io/jiumao2/pkuba-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish admin web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/admin-web.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          cache-from: type=gha,scope=pkuba-web
          cache-to: type=gha,mode=max,scope=pkuba-web
          build-args: |
            CADDY_BASE_IMAGE=ghcr.io/jiumao2/pkuba-caddy@${{ steps.base-images.outputs.caddy_digest }}
          tags: |
            ghcr.io/jiumao2/pkuba-web:${{ github.ref_name }}
            ghcr.io/jiumao2/pkuba-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

  miniapp:
    name: Build production mini program artifact
    needs: verified-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build:packages
      - name: Build for the production API domain
        env:
          PKUBA_API_BASE_URL: https://api.pkuba.cn
          PKUBA_ADMIN_WEB_URL: https://admin.pkuba.cn
        run: npm --workspace @pkuba/miniapp run build:weapp
      - uses: actions/upload-artifact@v4
        with:
          name: pkuba-miniapp-${{ github.ref_name }}
          path: apps/miniapp/dist
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: ${{ vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true' }}
    needs: [publish, miniapp]
    uses: ./.github/workflows/deploy-production.yml
    with:
      version_tag: ${{ github.ref_name }}
      release_commit: ${{ github.sha }}
      api_digest: ${{ needs.publish.outputs.api_digest }}
      web_digest: ${{ needs.publish.outputs.web_digest }}
    secrets: inherit

  github-release:
    name: Record successful release
    needs: [publish, miniapp, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      API_DIGEST: ${{ needs.publish.outputs.api_digest }}
      WEB_DIGEST: ${{ needs.publish.outputs.web_digest }}
      POSTGRES_DIGEST: ${{ needs.publish.outputs.postgres_digest }}
      CADDY_DIGEST: ${{ needs.publish.outputs.caddy_digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the GitHub release
        run: |
          notes=$(cat <<EOF
          Production deployment completed successfully.

          - Commit: \`$GITHUB_SHA\`
          - API image: \`ghcr.io/jiumao2/pkuba-api@$API_DIGEST\`
          - Web image: \`ghcr.io/jiumao2/pkuba-web@$WEB_DIGEST\`
          - PostgreSQL source/mirror: \`sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73\` / \`ghcr.io/jiumao2/pkuba-postgres@$POSTGRES_DIGEST\`
          - Caddy source/mirror: \`sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d\` / \`ghcr.io/jiumao2/pkuba-caddy@$CADDY_DIGEST\`
          - Mini program: attached as the workflow artifact \`pkuba-miniapp-$GITHUB_REF_NAME\`
          EOF
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "$notes"
          fi
