name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pkuba_test
          POSTGRES_USER: pkuba
          POSTGRES_PASSWORD: pkuba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pkuba -d pkuba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pkuba:pkuba@127.0.0.1:5432/pkuba_test
      DJANGO_SECRET_KEY: ci-only
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -r apps/api/requirements-dev.lock
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r apps/api/requirements.lock
      - run: python -m pip install --no-deps -e apps/api
      - run: ruff check apps/api
      - run: python apps/api/manage.py makemigrations --check --dry-run
      - run: python apps/api/manage.py migrate
      - run: pytest apps/api

  frontend:
    runs-on: ubuntu-latest
    env:
      PKUBA_API_BASE_URL: https://api.pkuba.cn
      PKUBA_ADMIN_WEB_URL: https://admin.pkuba.cn
    steps:
      - uses: actions/checkout@v4
      - name: Validate blue/green Compose, Caddy and deployment scripts
        run: bash scripts/prod/validate-blue-green.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:powershell
      - run: npm ls --all --omit=optional
      - run: npm run audit:production
      - name: Reject missing or insecure mini program production URLs
        run: |
          if env -u PKUBA_API_BASE_URL -u PKUBA_ADMIN_WEB_URL \
            npm --workspace @pkuba/miniapp run build:weapp; then
            echo "missing production URLs unexpectedly passed" >&2
            exit 1
          fi
          if PKUBA_API_BASE_URL=http://localhost:8088 \
            PKUBA_ADMIN_WEB_URL=http://localhost:5173 \
            npm --workspace @pkuba/miniapp run build:weapp; then
            echo "insecure local production URLs unexpectedly passed" >&2
            exit 1
          fi
          if PKUBA_API_BASE_URL=https://unapproved.example \
            PKUBA_ADMIN_WEB_URL=https://admin.pkuba.cn \
            npm --workspace @pkuba/miniapp run build:weapp; then
            echo "unapproved production API host unexpectedly passed" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -r apps/api/requirements.lock
      - run: python -m pip install --no-deps -e apps/api
      - run: npm ci
      - run: python apps/api/manage.py export_openapi --output docs/openapi.json
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
          DJANGO_SECRET_KEY: ci-only
      - run: npm run generate:api
      - run: git diff --exit-code -- docs/openapi.json packages/api-client/src/generated/schema.ts
