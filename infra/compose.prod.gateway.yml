services:
  gateway:
    image: ${PKUBA_CADDY_IMAGE:?PKUBA_CADDY_IMAGE is required}
    container_name: pkuba-gateway
    restart: unless-stopped
    environment:
      PKUBA_DOMAIN: ${PKUBA_DOMAIN:?PKUBA_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile.gateway:/etc/caddy/Caddyfile:ro
      - ${PKUBA_DEPLOY_STATE_DIR:?PKUBA_DEPLOY_STATE_DIR is required}:/srv/deployment-state:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [runtime]
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 4

volumes:
  caddy-data:
    name: ${PKUBA_CADDY_DATA_VOLUME:-pkuba-prod-caddy-data}
  caddy-config:
    name: ${PKUBA_CADDY_CONFIG_VOLUME:-pkuba-prod-caddy-config}

networks:
  runtime:
    external: true
    name: ${PKUBA_RUNTIME_NETWORK:-pkuba-prod-runtime}
