name: pkuba-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pkuba
      POSTGRES_USER: pkuba
      POSTGRES_PASSWORD: pkuba
    ports:
      - "5432:5432"
    volumes:
      - pkuba-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkuba -d pkuba"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
      target: development
    environment:
      DATABASE_URL: postgresql://pkuba:pkuba@db:5432/pkuba
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: local-development-only
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./docs:/workspace/docs
      - pkuba-dev-media:/app/.local/media
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pkuba-dev-postgres:
  pkuba-dev-media:
