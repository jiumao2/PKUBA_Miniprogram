services:
  db:
    image: ${PKUBA_POSTGRES_IMAGE:?PKUBA_POSTGRES_IMAGE is required}
    container_name: pkuba-data-db
    restart: unless-stopped
    env_file: ${PKUBA_ENV_FILE:?PKUBA_ENV_FILE is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      runtime:
        aliases: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
    external: true
    name: ${PKUBA_POSTGRES_VOLUME:?PKUBA_POSTGRES_VOLUME is required}

networks:
  runtime:
    external: true
    name: ${PKUBA_RUNTIME_NETWORK:-pkuba-prod-runtime}
